<?xml version="1.0" encoding="UTF-8"?>
<!--
  Layer 1 of 2 — the court.

  A tennis court seen from above: the doubles boundary, the singles sidelines,
  the two service lines and the centre service line. Drawn as filled
  rectangles rather than strokes, so nothing depends on how an importer
  chooses to interpret a stroke width.

  Line weights are set for the smallest size the icon is ever drawn at, not
  for this canvas. The thinnest line here is 28 units, which lands near five
  pixels once a 60-point icon is rendered at 3x, and the doubles alleys keep
  about eight pixels of clear space at that size. Anything finer turns the
  mark into grey mush on a home screen.

  No background, no gradient, no shadow, no opacity — all of that belongs in
  Icon Composer, per Apple's guidance for Liquid Glass icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g fill="#FFFFFF">

    <!-- Doubles boundary. -->
    <rect x="122" y="267" width="780" height="34"/>
    <rect x="122" y="723" width="780" height="34"/>
    <rect x="122" y="267" width="34" height="490"/>
    <rect x="868" y="267" width="34" height="490"/>

    <!-- Singles sidelines, leaving the doubles alleys either side. -->
    <rect x="122" y="343" width="780" height="28"/>
    <rect x="122" y="653" width="780" height="28"/>

    <!-- Service lines, spanning between the singles sidelines. -->
    <rect x="302" y="343" width="28" height="338"/>
    <rect x="694" y="343" width="28" height="338"/>

    <!-- Centre service line, dividing the two service boxes. -->
    <rect x="302" y="498" width="420" height="28"/>

  </g>
</svg>
